name: Auto-merge OpenAPI description updates

# Merges the newest open `github-openapi-bot` "Update OpenAPI 3.x Descriptions"
# PRs and closes the older superseded ones.
#
# Why a workflow instead of native auto-merge / the merge API: these PRs carry
# 100K+ line diffs across 64+ files. `PUT /pulls/{n}/merge` returns 502/504 and
# `GET /pulls/{n}/files` returns 422 on them, so the merge is done with plain
# git against a blobless clone.
#
# This runs continuously. The safety properties of the manual process are
# preserved: lint must be green, the semantic breaking-change scan must come
# back clean, and a change summary is posted to the PR before merge.
#
# Merges are additionally held during a GHES release-candidate window. See the
# "Check for an active merge freeze" step for how that is detected.

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Analyze and report, but do not merge or close anything'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-openapi-updates
  cancel-in-progress: false

env:
  BOT_LOGIN: github-openapi-bot
  # Status checks that must be green before merging. CodeQL is deliberately
  # excluded: default setup only scans the `actions` language, it is not a
  # required check on main, and it routinely reports `timed_out` on these PRs.
  REQUIRED_CHECKS: 'Lint OpenAPI 3.0 releases,Lint OpenAPI 3.1 releases'

jobs:
  auto-merge:
    name: Auto-merge OpenAPI updates
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.merge.outputs.status }}
      detail: ${{ steps.merge.outputs.detail }}
    steps:
      - name: Select candidate PRs
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          open_prs=$(gh pr list \
            --state open \
            --author "$BOT_LOGIN" \
            --limit 100 \
            --json number,title,headRefName,headRefOid,createdAt)

          select_newest() {
            jq -r --arg t "$1" \
              '[.[] | select(.title == $t)] | sort_by(.createdAt) | last // empty' <<<"$open_prs"
          }

          newest_30=$(select_newest 'Update OpenAPI 3.0 Descriptions')
          newest_31=$(select_newest 'Update OpenAPI 3.1 Descriptions')
          newest_30=${newest_30:-null}
          newest_31=${newest_31:-null}

          pr_30=$(jq -r '.number // empty' <<<"$newest_30")
          pr_31=$(jq -r '.number // empty' <<<"$newest_31")

          if [ -z "$pr_30" ] && [ -z "$pr_31" ]; then
            echo "No open $BOT_LOGIN description PRs. Nothing to do."
            echo "found=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "found=true"
            echo "pr_30=$pr_30"
            echo "pr_31=$pr_31"
            echo "ref_30=$(jq -r '.headRefName // empty' <<<"$newest_30")"
            echo "ref_31=$(jq -r '.headRefName // empty' <<<"$newest_31")"
          } >>"$GITHUB_OUTPUT"

          # Every open bot PR that is not one of the two selected is superseded.
          superseded=$(jq -r \
            --argjson keep30 "${pr_30:-0}" \
            --argjson keep31 "${pr_31:-0}" \
            '[.[].number | select(. != $keep30 and . != $keep31)] | join(" ")' \
            <<<"$open_prs")
          echo "superseded=$superseded" >>"$GITHUB_OUTPUT"

          echo "3.0 PR: ${pr_30:-none} / 3.1 PR: ${pr_31:-none}"
          echo "Superseded: ${superseded:-none}"

      - name: Verify required checks are green
        id: checks
        if: steps.select.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_30: ${{ steps.select.outputs.pr_30 }}
          PR_31: ${{ steps.select.outputs.pr_31 }}
        run: |
          set -euo pipefail

          blocked=''
          for pr in $PR_30 $PR_31; do
            [ -n "$pr" ] || continue
            sha=$(gh pr view "$pr" --json headRefOid -q .headRefOid)
            runs=$(gh api "repos/$GH_REPO/commits/$sha/check-runs" --paginate \
              -q '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion)"')

            IFS=',' read -ra required <<<"$REQUIRED_CHECKS"
            for name in "${required[@]}"; do
              matches=$(awk -F'\t' -v n="$name" '$1 == n' <<<"$runs")
              if [ -z "$matches" ]; then
                blocked+="PR #$pr: required check '$name' has not reported. "
                continue
              fi
              if grep -qv $'\tcompleted\tsuccess$' <<<"$matches"; then
                blocked+="PR #$pr: check '$name' is not passing. "
              fi
            done
          done

          if [ -n "$blocked" ]; then
            echo "status=blocked" >>"$GITHUB_OUTPUT"
            echo "detail=$blocked" >>"$GITHUB_OUTPUT"
            echo "::notice::$blocked"
          else
            echo "status=green" >>"$GITHUB_OUTPUT"
          fi

      - name: Check for an active merge freeze
        id: freeze
        if: steps.select.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_30: ${{ steps.select.outputs.ref_30 }}
          REF_31: ${{ steps.select.outputs.ref_31 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Around a GHES release candidate, hold description merges until the
          # coordinated release content is ready. A new GHES version appearing
          # in the candidate PR before it exists on the default branch is the
          # public signal that this window may be active.

          reason=''

          # --- Signal 1: an explicit, human-controlled hold ----------------
          # A label is the escape hatch that does not depend on inference, and
          # lets Docs or the FR stop merges for any reason at all.
          if gh label list --search 'merge-freeze' --json name -q '.[].name' | grep -qx 'merge-freeze'; then
            frozen=$(gh issue list --label 'merge-freeze' --state open --json number,title \
              -q '.[] | "#\(.number) \(.title)"' | head -5)
            if [ -n "$frozen" ]; then
              reason+="Open 'merge-freeze' issue(s): $(tr '\n' ';' <<<"$frozen") "
            fi
          fi

          # --- Signal 2: a GHES version not yet on the default branch ------
          ghes_on_main=$(gh api "repos/$GH_REPO/contents/descriptions?ref=$DEFAULT_BRANCH" \
            -q '.[].name' | grep '^ghes-' | sort -u)

          for ref in "$REF_30" "$REF_31"; do
            [ -n "$ref" ] || continue
            for dir in descriptions descriptions-next; do
              on_pr=$(gh api "repos/$GH_REPO/contents/$dir?ref=$ref" \
                -q '.[].name' 2>/dev/null | grep '^ghes-' | sort -u || true)
              [ -n "$on_pr" ] || continue
              new=$(comm -13 <(echo "$ghes_on_main") <(echo "$on_pr") | tr '\n' ' ')
              if [ -n "${new// /}" ]; then
                reason+="$ref/$dir introduces new GHES version(s): $new "
              fi
            done
          done

          if [ -n "$reason" ]; then
            echo "status=frozen" >>"$GITHUB_OUTPUT"
            echo "detail=$reason" >>"$GITHUB_OUTPUT"
            echo "::warning::Merge freeze in effect, holding. $reason"
          else
            echo "status=clear" >>"$GITHUB_OUTPUT"
            echo "No merge freeze detected."
          fi

      - name: Checkout (blobless)
        if: steps.checks.outputs.status == 'green' && steps.freeze.outputs.status == 'clear'
        uses: actions/checkout@v4
        with:
          # Blobless fetch keeps this off the ~4.6 GB full history while still
          # allowing real merges. Blobs for the touched files are fetched lazily.
          filter: blob:none
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        if: steps.checks.outputs.status == 'green' && steps.freeze.outputs.status == 'clear'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        if: steps.checks.outputs.status == 'green' && steps.freeze.outputs.status == 'clear'
        # Reuses the repo's existing pinned/hash-verified requirements, which
        # already provide pyyaml for the linter workflow.
        run: pip install --require-hashes -r requirements.txt

      - name: Scan for breaking changes
        id: breaking
        if: steps.checks.outputs.status == 'green' && steps.freeze.outputs.status == 'clear'
        env:
          REF_30: ${{ steps.select.outputs.ref_30 }}
          REF_31: ${{ steps.select.outputs.ref_31 }}
          PR_30: ${{ steps.select.outputs.pr_30 }}
          PR_31: ${{ steps.select.outputs.pr_31 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # A semantic (parsed) comparison rather than a diff scan. The two are
          # not equivalent: for a *request* body, ADDING to `required` is
          # breaking, while for a *response* body, REMOVING from `required` is
          # breaking. A scan of removed diff lines is structurally blind to the
          # first case. Rules mirror the breaking-change list in
          # the project's documented release-compatibility rules.
          findings=''
          : >summary.md

          for pair in \
            "$REF_30|descriptions/api.github.com/api.github.com.yaml|3.0|$PR_30" \
            "$REF_31|descriptions-next/api.github.com/api.github.com.yaml|3.1|$PR_31"; do
            IFS='|' read -r ref file label pr <<<"$pair"
            [ -n "$ref" ] || continue

            git fetch --no-tags --filter=blob:none origin "$ref":"refs/remotes/origin/$ref"

            # api.github.com is the non-dereferenced source of truth: compact,
            # $ref-based, and every platform variant derives from it.
            git show "origin/$DEFAULT_BRANCH:$file" >base.yaml
            git show "origin/$ref:$file" >head.yaml

            python3 .github/scripts/openapi-breaking-changes.py base.yaml head.yaml >result.json

            count=$(jq '.findings | length' result.json)
            {
              echo "### OpenAPI $label (#$pr)"
              echo
              jq -r '.summary |
                "- Operations: \(.total_operations) total, \(.added_operations | length) added",
                "- Schemas: \(.total_schemas) total, \(.added_schemas | length) added"' result.json
              jq -r '.summary.added_operations[]? | "  - `\(.)`"' result.json | head -40
              echo
            } >>summary.md

            if [ "$count" -gt 0 ]; then
              findings+="$label (#$pr): $count breaking finding(s). "
              {
                echo "#### :rotating_light: Breaking changes in $label"
                echo
                jq -r '.findings[] | "- **\(.rule)**: \(.detail)"' result.json | head -50
                echo
              } >>summary.md
            fi
          done

          cat summary.md

          if [ -n "$findings" ]; then
            echo "status=breaking" >>"$GITHUB_OUTPUT"
            echo "detail=$findings" >>"$GITHUB_OUTPUT"
            echo "::warning::Potential breaking changes, skipping auto-merge. $findings"
          else
            echo "status=clean" >>"$GITHUB_OUTPUT"
          fi

      - name: Post change summary to PRs
        if: steps.checks.outputs.status == 'green' && steps.freeze.outputs.status == 'clear'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_30: ${{ steps.select.outputs.pr_30 }}
          PR_31: ${{ steps.select.outputs.pr_31 }}
          BREAKING: ${{ steps.breaking.outputs.status }}
        run: |
          set -euo pipefail

          # Release notes are generated from PR descriptions. Auto-merging
          # untouched bodies would remove useful context, so post the analysis
          # the scanner already computed.
          {
            if [ "$BREAKING" = 'breaking' ]; then
              echo "## :rotating_light: Auto-merge skipped: potential breaking changes"
            else
              echo "## Automated change summary"
            fi
            echo
            cat summary.md
            echo "_Posted by the auto-merge workflow ([run](${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}))._"
          } >comment.md

          for pr in $PR_30 $PR_31; do
            [ -n "$pr" ] || continue
            gh pr comment "$pr" --body-file comment.md || echo "::warning::Could not comment on #$pr"
          done

      - name: Merge and close superseded PRs
        id: merge
        if: >-
          steps.checks.outputs.status == 'green' &&
          steps.freeze.outputs.status == 'clear' &&
          steps.breaking.outputs.status == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_30: ${{ steps.select.outputs.pr_30 }}
          PR_31: ${{ steps.select.outputs.pr_31 }}
          REF_30: ${{ steps.select.outputs.ref_30 }}
          REF_31: ${{ steps.select.outputs.ref_31 }}
          SUPERSEDED: ${{ steps.select.outputs.superseded }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would merge PRs ${PR_30:-none} and ${PR_31:-none}, close: ${SUPERSEDED:-none}"
            echo "status=dry-run" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout "$DEFAULT_BRANCH"

          merged=''
          # 3.0 first, then 3.1: they touch disjoint trees but this ordering
          # keeps the generated merge history readable.
          for pair in "$PR_30:$REF_30" "$PR_31:$REF_31"; do
            pr="${pair%%:*}"; ref="${pair#*:}"
            [ -n "$pr" ] && [ -n "$ref" ] || continue
            git fetch --no-tags origin "$ref":"refs/remotes/origin/$ref" --filter=blob:none
            git merge --no-ff "origin/$ref" -m "Merge pull request #$pr from $ref"
            merged+="#$pr "
          done

          if [ -n "$merged" ]; then
            git push origin "$DEFAULT_BRANCH"
            echo "Merged and pushed: $merged"
          fi

          for pr in $SUPERSEDED; do
            gh pr close "$pr" \
              --comment "Superseded by the newer OpenAPI description update(s) ${merged:-just merged}. Closing automatically." \
              || echo "::warning::Failed to close #$pr"
          done

          echo "status=merged" >>"$GITHUB_OUTPUT"
          echo "detail=Merged $merged" >>"$GITHUB_OUTPUT"

      - name: Summarize exceptions
        if: >-
          failure() ||
          steps.breaking.outputs.status == 'breaking' ||
          steps.freeze.outputs.status == 'frozen'
        run: |
          {
            echo "## Auto-merge did not proceed"
            echo
            if [ "${{ steps.freeze.outputs.status }}" = "frozen" ]; then
              echo "A merge freeze was detected: ${{ steps.freeze.outputs.detail }}"
            elif [ "${{ steps.breaking.outputs.status }}" = "breaking" ]; then
              echo "Potential breaking changes were detected: ${{ steps.breaking.outputs.detail }}"
            else
              echo "The workflow failed before merging. Review the failed step above."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
