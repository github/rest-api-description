---
name: Test workflow scripts
permissions:
  contents: read

on:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/scripts-tests.yml'
      - '.github/workflows/check-for-spammy-issues.yml'
      - '.github/ISSUE_TEMPLATE/schema-inaccuracy.md'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/scripts-tests.yml'
      - '.github/workflows/check-for-spammy-issues.yml'
      - '.github/ISSUE_TEMPLATE/schema-inaccuracy.md'
  workflow_dispatch:

jobs:
  unittest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        name: Install Python
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover --start-directory .github/scripts --verbose
        name: Run script tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        name: Install NodeJS
        with:
          node-version: '22'
      - run: node --test .github/scripts/test_*.js
        name: Run JavaScript script tests
